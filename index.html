<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="70.3 Planner">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;70.3 Planner&quot;,&quot;short_name&quot;:&quot;70.3&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230f0f0f&quot;,&quot;theme_color&quot;:&quot;%23e8ff47&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230f0f0f'/><text y='75' x='15' font-size='70'>⚡</text></svg>&quot;,&quot;sizes&quot;:&quot;any&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>70.3 Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2a2a2a;--border2:#333;--border3:#404040;
  --text:#f0efe8;--text2:#9a9890;--text3:#5a5856;
  --accent:#e8ff47;--accent2:#c8e030;
  --swim:#38bdf8;--swim-bg:rgba(56,189,248,.08);--swim-bd:rgba(56,189,248,.25);
  --bike:#4ade80;--bike-bg:rgba(74,222,128,.08);--bike-bd:rgba(74,222,128,.25);
  --run:#fb923c;--run-bg:rgba(251,146,60,.08);--run-bd:rgba(251,146,60,.25);
  --gym:#a78bfa;--gym-bg:rgba(167,139,250,.08);--gym-bd:rgba(167,139,250,.25);
  --red:#f87171;--red-bg:rgba(248,113,113,.1);
  --r:12px;--rsm:8px;--rxs:5px;
  --sh:0 0 0 1px rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.4);
}
body.theme-light{--bg:#f5f4f0;--bg2:#fff;--bg3:#eeece7;--bg4:#e6e3dc;--border:#dedad2;--border2:#ccc9c0;--border3:#b0aca4;--text:#1a1916;--text2:#6b6860;--text3:#a09d96;--sh:0 1px 4px rgba(0,0,0,.08)}
body.theme-ocean{--bg:#040d1a;--bg2:#071428;--bg3:#0a1e38;--bg4:#0f2848;--border:#1a3050;--border2:#234268;--border3:#2e5480;--text:#e8f4ff;--text2:#7ab0d8;--text3:#3a6a90;--accent:#00d4ff;--accent2:#00b8e0}
body.theme-forest{--bg:#060f08;--bg2:#0a1a0c;--bg3:#0f2414;--bg4:#152e1a;--border:#1e3a22;--border2:#2a5030;--border3:#366640;--text:#e8f5e8;--text2:#7ab87a;--text3:#3a6840;--accent:#7fff7f;--accent2:#60e060}
body.theme-sunset{--bg:#120608;--bg2:#1e0c10;--bg3:#2a1018;--bg4:#361420;--border:#3a1820;--border2:#502030;--border3:#662840;--text:#fff0ec;--text2:#d48888;--text3:#804848;--accent:#ff6b6b;--accent2:#e05050}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden}
::selection{background:var(--accent);color:#000}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px}
.shell{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
/* SIDEBAR */
.brand{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.brand-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--accent);line-height:1}
.brand-sub{font-size:10px;color:var(--text3);margin-top:2px}
.countdown-box{margin:.75rem 1.25rem;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:.75rem;border-left:3px solid var(--accent)}
.cd-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.cd-days{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--accent);line-height:1}
.cd-date{font-size:10px;color:var(--text2);margin-top:1px}
.nav-section{padding:.75rem 0 .25rem}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:0 1.25rem;margin-bottom:.3rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:.5rem 1.25rem;font-size:13px;color:var(--text2);cursor:pointer;transition:all .12s;border-left:2px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(232,255,71,.05);color:var(--accent);border-left-color:var(--accent)}
body.theme-light .nav-item.active{background:rgba(0,0,0,.05);color:var(--text)}
body.theme-ocean .nav-item.active{background:rgba(0,212,255,.06)}
body.theme-forest .nav-item.active{background:rgba(127,255,127,.06)}
body.theme-sunset .nav-item.active{background:rgba(255,107,107,.06)}
.nav-item .ni{font-size:14px;width:18px;text-align:center}
.week-section{flex:1;overflow-y:auto}
.phase-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.6rem 1.25rem .2rem;color:var(--text3)}
.week-row{display:flex;align-items:center;padding:.38rem 1.25rem;font-size:12px;color:var(--text2);cursor:pointer;transition:all .12s;gap:5px;border-left:2px solid transparent}
.week-row:hover{background:var(--bg3);color:var(--text)}
.week-row.active{background:rgba(232,255,71,.05);color:var(--accent);border-left-color:var(--accent)}
.week-row .wr-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.week-row .wr-prog{font-size:9px;opacity:.55}
.week-row .wr-del{opacity:0;font-size:9px;padding:1px 4px;border-radius:3px;border:none;background:rgba(248,113,113,.15);color:var(--red);cursor:pointer}
.week-row:hover .wr-del,.week-row.active .wr-del{opacity:1}
.wr-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.b-base{background:rgba(74,222,128,.15);color:#4ade80}
.b-build{background:rgba(251,146,60,.15);color:#fb923c}
.b-peak{background:rgba(248,113,113,.15);color:#f87171}
.b-taper{background:rgba(167,139,250,.15);color:#a78bfa}
.b-race{background:rgba(232,255,71,.15);color:var(--accent)}
/* THEME DOTS */
.theme-row{display:flex;align-items:center;gap:5px;padding:.5rem 1.25rem;border-top:1px solid var(--border)}
.theme-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-right:3px}
.tdot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.tdot:hover{transform:scale(1.2)}
.tdot.on{border-color:var(--text)}
/* SYNC BAR */
.sync-bar{display:flex;align-items:center;gap:6px;padding:.4rem 1.25rem;font-size:11px;color:var(--text3);cursor:pointer;border-top:1px solid var(--border);transition:all .12s}
.sync-bar:hover{background:var(--bg3);color:var(--text2)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot.ok{background:#4ade80}
.sdot.busy{background:var(--accent);animation:pulse .8s infinite}
.sdot.err{background:#f87171}
.sdot.off{background:var(--text3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* SIDEBAR FOOTER */
.sf{padding:.75rem 1.25rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.sf-btn{font-size:11px;padding:5px 8px;border-radius:var(--rsm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;text-align:left;transition:all .12s;display:flex;align-items:center;gap:6px}
.sf-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border3)}
.sf-btn.hi{border-color:rgba(232,255,71,.3);color:var(--accent);background:rgba(232,255,71,.05)}
.sf-btn.hi:hover{background:rgba(232,255,71,.1)}
.sf-btn.danger{color:var(--red);border-color:rgba(248,113,113,.2)}
/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 1.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px}
.topbar-pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--text3)}
.topbar-actions{display:flex;gap:5px}
.tb-btn{font-size:12px;padding:5px 11px;border-radius:var(--rsm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.tb-btn:hover{background:var(--bg3);color:var(--text)}
.tb-btn.accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.tb-btn.accent:hover{background:var(--accent2)}
/* CONTENT */
.content{padding:1.5rem 1.75rem;flex:1}
/* DAY NAV */
.day-nav{display:flex;gap:5px;margin-bottom:1.25rem;flex-wrap:wrap}
.day-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:4px}
.day-btn:hover{border-color:var(--border3);color:var(--text)}
.day-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.ddot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:none}
.day-btn.has-done .ddot{display:block}
.day-btn.active .ddot{background:var(--bg)}
/* SESSION CARDS */
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;overflow:hidden;transition:border-color .15s;box-shadow:var(--sh)}
.scard:hover{border-color:var(--border2)}
.scard.done{border-color:rgba(74,222,128,.2)}
.scard.t-swim{border-left:3px solid var(--swim)}
.scard.t-bike{border-left:3px solid var(--bike)}
.scard.t-run{border-left:3px solid var(--run)}
.scard.t-gym{border-left:3px solid var(--gym)}
.scard.t-rest{border-left:3px solid #6b7280}
.ctop{display:flex;align-items:flex-start;gap:9px;padding:.75rem .875rem .625rem}
.ccheck{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border3);background:transparent;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:10px;color:transparent}
.ccheck:hover{border-color:var(--bike)}
.scard.done .ccheck{background:var(--bike);border-color:var(--bike);color:#000}
.cmeta{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.cicon{font-size:14px}
.ctitle{font-size:13px;font-weight:500}
.scard.done .ctitle{color:var(--text2);text-decoration:line-through;text-decoration-color:var(--border3)}
.cbadge{font-size:9px;font-weight:600;padding:1px 6px;border-radius:20px;text-transform:uppercase}
.cbadge.swim{background:var(--swim-bg);color:var(--swim);border:1px solid var(--swim-bd)}
.cbadge.bike{background:var(--bike-bg);color:var(--bike);border:1px solid var(--bike-bd)}
.cbadge.run{background:var(--run-bg);color:var(--run);border:1px solid var(--run-bd)}
.cbadge.gym{background:var(--gym-bg);color:var(--gym);border:1px solid var(--gym-bd)}
.cbadge.rest{background:rgba(107,114,128,.1);color:#6b7280;border:1px solid rgba(107,114,128,.2)}
.done-tag{font-size:9px;font-weight:600;color:var(--bike);text-transform:uppercase;margin-left:auto}
.cactions{display:flex;gap:3px;flex-shrink:0}
.cbtn{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.cbtn:hover{background:var(--bg3);color:var(--text)}
.cbtn.red:hover{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.3)}
.opt-tabs{display:flex;gap:4px;padding:0 .875rem .5rem;flex-wrap:wrap}
.otab{font-size:10px;padding:2px 9px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.otab:hover{color:var(--text);border-color:var(--border3)}
.otab.on{background:var(--bg3);color:var(--text);border-color:var(--border3)}
.otab.on.swim{color:var(--swim);border-color:var(--swim-bd)}
.otab.on.bike{color:var(--bike);border-color:var(--bike-bd)}
.otab.on.run{color:var(--run);border-color:var(--run-bd)}
.otab.on.gym{color:var(--gym);border-color:var(--gym-bd)}
.cbody{padding:.625rem .875rem .875rem;font-size:12px;color:var(--text2);line-height:1.8;font-family:'DM Mono',monospace;white-space:pre-wrap;border-top:1px solid var(--border)}
.scard.done .cbody{opacity:.45}
/* PERF LOG */
.perf-log{border-top:1px solid var(--border);padding:.625rem .875rem .75rem}
.perf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;cursor:pointer;user-select:none}
.perf-head-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.pfields{display:grid;gap:7px;margin-bottom:.5rem}
.pfields.sw{grid-template-columns:1fr 1fr 1fr}
.pfields.bk{grid-template-columns:1fr 1fr 1fr 1fr}
.pfields.rn{grid-template-columns:1fr 1fr 1fr}
.pfield label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);display:block;margin-bottom:3px}
.pinput{font-size:12px;padding:5px 8px;border-radius:var(--rxs);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'DM Mono',monospace;width:100%}
.pinput:focus{outline:none;border-color:var(--border3)}
.gym-table{width:100%;border-collapse:collapse;margin-bottom:.5rem}
.gym-table th{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:2px 4px;text-align:left}
.gym-table td{padding:2px 4px}
.gx-input{font-size:11px;padding:3px 6px;border-radius:var(--rxs);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'DM Mono',monospace;width:100%}
.gx-input:focus{outline:none;border-color:var(--border3)}
.add-ex-btn{font-size:10px;padding:3px 9px;border-radius:var(--rxs);border:1px dashed var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.add-ex-btn:hover{border-color:var(--border3);color:var(--text)}
.feel-row{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.flabel{font-size:10px;color:var(--text3)}
.fbtn{font-size:15px;padding:2px 4px;border:1.5px solid transparent;border-radius:4px;background:transparent;cursor:pointer;transition:all .12s;line-height:1}
.fbtn:hover,.fbtn.on{border-color:var(--border3);background:var(--bg4)}
.fnote{flex:1;min-width:90px;font-size:11px;padding:3px 7px;border-radius:var(--rxs);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif}
.fnote:focus{outline:none;border-color:var(--border3)}
.photo-row{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.pthumb{width:34px;height:34px;border-radius:4px;object-fit:cover;border:1px solid var(--border2);cursor:pointer}
.add-photo-btn{font-size:10px;padding:3px 9px;border-radius:var(--rxs);border:1px dashed var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.add-photo-btn:hover{border-color:var(--border3);color:var(--text)}
/* INFO BLOCK */
.info-block{background:rgba(232,255,71,.04);border:1px solid rgba(232,255,71,.1);border-radius:var(--r);padding:.75rem .875rem;margin-bottom:.75rem}
.info-block-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:.35rem;opacity:.7}
.info-block-body{font-size:12px;color:rgba(232,255,71,.65);line-height:1.75;white-space:pre-wrap;font-family:'DM Mono',monospace}
/* PHASE STRIP */
.phase-strip{display:flex;gap:2px;margin-bottom:1.25rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.4rem;overflow-x:auto}
.pblock{flex:1;min-width:50px;padding:4px 6px;border-radius:var(--rxs);text-align:center}
.pblock .pbn{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pblock .pbw{font-size:8px;margin-top:1px;opacity:.55}
.pb-base{background:rgba(74,222,128,.1);color:#4ade80}
.pb-build{background:rgba(251,146,60,.1);color:#fb923c}
.pb-peak{background:rgba(248,113,113,.1);color:#f87171}
.pb-taper{background:rgba(167,139,250,.1);color:#a78bfa}
.pb-race{background:rgba(232,255,71,.1);color:var(--accent)}
/* CHARTS */
.cfilter-row{display:flex;gap:5px;margin-bottom:1rem;flex-wrap:wrap}
.cftab{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.cftab:hover{color:var(--text)}
.cftab.on{background:var(--bg3);color:var(--text);border-color:var(--border3)}
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.mcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.875rem;box-shadow:var(--sh);text-align:center}
.mval{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;line-height:1;margin-bottom:3px}
.mlbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem;box-shadow:var(--sh)}
.chart-card.wide{grid-column:1/-1}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.chart-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text2)}
.chart-sub{font-size:11px;color:var(--text3)}
.chart-wrap{position:relative;height:200px}
.chart-wrap.tall{height:260px}
/* CALENDAR */
.cal-months{display:flex;flex-direction:column;gap:2rem}
.cal-month-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--text2);margin-bottom:.5rem}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-dname{text-align:center;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:5px;min-height:72px;cursor:pointer;transition:all .15s;overflow:hidden}
.cal-cell:hover{border-color:var(--border2)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell.cur-week{border-color:rgba(232,255,71,.25)}
.cal-cell.race{border-color:var(--accent);background:rgba(232,255,71,.05)}
.cal-cell.today .cal-dnum{color:var(--accent);font-weight:600}
.cal-dnum{font-size:10px;color:var(--text2);margin-bottom:4px;font-family:'DM Mono',monospace}

/* PASSWORD LOCK */

.lock-sub{font-size:13px;color:#5a5856;margin-bottom:2.5rem;letter-spacing:.05em}
.lock-input{font-size:18px;padding:12px 20px;border-radius:10px;border:1px solid #333;background:#161616;color:#f0efe8;font-family:'DM Mono',monospace;text-align:center;letter-spacing:.2em;width:240px;outline:none;transition:border-color .2s}
.lock-input:focus{border-color:#e8ff47}

.lock-btn{margin-top:1rem;padding:11px 32px;background:#e8ff47;color:#000;border:none;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .12s;width:240px}

// ══════ PLAN GENERATOR ══════
function phaseName(n,total) {
  const p = n/total;
  if (p<0.35) return 'Base';
  if (p<0.65) return 'Build';
  if (p<0.85) return 'Peak';
  if (n===total) return 'Race';
  return 'Taper';
}
function phaseKey(ph) { return {Base:'base',Build:'build',Peak:'peak',Taper:'taper',Race:'race'}[ph]||'base'; }
function buildOpts(type,intensity) { return (WK[type]?.[intensity]||[]).map((w,i)=>({...w,type,intensity,id:i})); }

function genWeek(wn,total,phase) {
  const iB=phase==='Base',iU=phase==='Build',iP=phase==='Peak',iT=phase==='Taper',iR=phase==='Race';
  const si=iP?'hard':iU?'moderate':'easy';
  const bi=iP?'hard':iU?'moderate':'easy';
  const ri=iP?'hard':iU?'moderate':'easy';
  const runOpts=(intensity)=>buildRunOpts(intensity).length?buildRunOpts(intensity):buildOpts('run',intensity);
  const d={};
  if (iR) {
    d.MONDAY={subtitle:'Rest & Travel',sessions:[],info:'Race week. Rest. Trust your training.'};
    d.TUESDAY={subtitle:'Shakeout Swim',sessions:[{title:'🏊 Easy Swim',type:'swim',done:false,options:buildOpts('swim','easy'),activeOption:0,lines:WK.swim.easy[0].lines}],info:''};
    d.WEDNESDAY={subtitle:'Bike + Run Shakeout',sessions:[
      {title:'🚴 Short Spin',type:'bike',done:false,options:[{name:'Shakeout',lines:['30 min very easy','Check bike is dialed']}],activeOption:0,lines:['30 min very easy','Check bike is dialed']},
      {title:'🏃 5 min Jog',type:'run',done:false,options:[{name:'Shakeout',lines:['5 min easy jog','Check everything feels right']}],activeOption:0,lines:['5 min easy jog']}
    ],info:''};
    d.THURSDAY={subtitle:'Full Rest',sessions:[],info:'Full rest. Prep gear. Sleep.'};
    d.FRIDAY={subtitle:'Race Venue Swim',sessions:[{title:'🏊 Open Water Warm-up',type:'swim',done:false,options:[{name:'Venue Swim',lines:['600m easy in race venue','Sight the buoys','Check wetsuit']}],activeOption:0,lines:['600m easy','Sight buoys','Stay calm']}],info:'Rack bike. Walk run course.'};
    d.SATURDAY={subtitle:'REST — Race Tomorrow!',sessions:[],info:'Eat carbs. Hydrate. Sleep 8+ hrs.\nLay out all gear tonight.'};
    d.SUNDAY={subtitle:'🏆 RACE DAY',sessions:[
      {title:'🏊 Swim 1.9 km',type:'swim',done:false,options:[{name:'Race',lines:['Start controlled','Steady rhythm','Sight every 10 strokes']}],activeOption:0,lines:['Start controlled','Find rhythm at 200m','Sight every 10 strokes']},
      {title:'🚴 Bike 90 km',type:'bike',done:false,options:[{name:'Race',lines:['First 15 km: resist going hard','Eat every 30-40 min','Leave something for the run']}],activeOption:0,lines:['Ride your race','Eat before hungry']},
      {title:'🏃 Run 21.1 km',type:'run',done:false,options:[{name:'Race',lines:['First 3 km: start slow','Build into pace','Coke at aid stations from km 14+']}],activeOption:0,lines:['Run YOUR pace','Give everything in final 2 km']}
    ],info:'YOU GOT THIS.'};
    return {days:d,phase:'Race',subtitle:'RACE WEEK'};
  }
  d.MONDAY={subtitle:'Recovery',sessions:[],info:'Active recovery or full rest.'};
  d.TUESDAY={subtitle:'Bike + Brick + Gym',sessions:[

  d.THURSDAY={subtitle:'Run + Gym',sessions:[

  ],info:''};

function generateFullPlan() {
  const total = weeksUntilRace();
  const wks = {};
  for (let i=1; i<=total; i++) {
    const ph = phaseName(i,total);
    const key = 'week'+i;
    wks[key] = genWeek(i,total,ph);
    wks[key].weekNum = i;
  }
  return wks;
}

// ══════ PARSER ══════
const DAY_NAMES = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
const TRAIN_KW = /swim|bike|zwift|run|jog|brick|gym|strength|upper|lower|core|bench|squat|deadlift|warm.?up|cool.?down|interval|tempo|z[0-9]|cadence|pace|km|miles|\bmin\b|drill|kick|threshold|aerobic/i;
const INFO_KW = /summary|goal|tip|monitor|check|adjust|reminder|important|avoid|rule|nutrition|biggest mistake/i;
const SESS_START = /^(🏊|🚴|🏃|🏋|swim|bike|run|gym|brick|option [ab]|upper|lower|core)/i;

function parseWeek(raw) {
  const lines=raw.split('\n'),result={days:{},meta:[]};
  let curDay=null,curSess=null,sessLines=[],infoLines=[];
  const flushSess=()=>{
    if(curSess&&curDay){
      const body=sessLines.filter(l=>l.trim());
      const t=detectType(curSess.title);
      const opts=WK[t]?buildOpts(t,'easy'):[];
      result.days[curDay].sessions.push({...curSess,lines:body,type:t,done:false,options:opts.length?opts:[{name:'Custom',lines:body}],activeOption:0});
      curSess=null;sessLines=[];
    }
  };
  const flushInfo=()=>{if(infoLines.length&&curDay)result.days[curDay].info=((result.days[curDay].info||'')+infoLines.join('\n')+'\n').trim();infoLines=[];};
  for(const line of lines){
    const t=line.trim();if(!t)continue;
    let fd=null;
    for(const d of DAY_NAMES){const u=t.toUpperCase();if((u.startsWith(d)||(u.includes(d)&&/[—–\-]/.test(t)))&&t.length<80){fd=d;break;}}
    if(fd){flushSess();flushInfo();curDay=fd;if(!result.days[curDay])result.days[curDay]={sessions:[],info:''};const sub=t.replace(new RegExp(fd,'i'),'').replace(/^[\s—–\-:]+/,'').trim();if(sub)result.days[curDay].subtitle=sub;continue;}
    if(!curDay){result.meta.push(t);continue;}
    const isSH=SESS_START.test(t)&&t.length<120;const isInfo=INFO_KW.test(t)&&!TRAIN_KW.test(t);
    if(isSH&&!isInfo){flushSess();flushInfo();curSess={title:t,type:detectType(t)};sessLines=[];}
    else if(curSess){if(TRAIN_KW.test(t)||/^[\*\-•]/.test(t)||/^\d+[x×]/.test(t)||t.length<100)sessLines.push(t);else{flushSess();infoLines.push(t);}}
    else if(isInfo)infoLines.push(t);
    else if(TRAIN_KW.test(t)){flushInfo();if(!curSess){curSess={title:guessTitle(t),type:detectType(t)};sessLines=[];}sessLines.push(t);}
    else infoLines.push(t);
  }
  flushSess();flushInfo();
  for(const d of Object.keys(result.days))if(!result.days[d].info?.trim())result.days[d].info='';
  return result;
}
function detectType(t) {
  t=(t||'').toLowerCase();
  if(/swim|pool|🏊|stroke|kick|drill/.test(t))return 'swim';
  if(/bike|zwift|cycling|spin|cadence|🚴/.test(t))return 'bike';
  if(/run|jog|brick|🏃/.test(t))return 'run';
  if(/gym|strength|upper|lower|bench|squat|deadlift|pull.?up|press|core|plank|🏋|glute/.test(t))return 'gym';
  if(/rest|recovery|optional/.test(t))return 'rest';
  return 'general';
}
function typeIcon(t){return{swim:'🏊',bike:'🚴',run:'🏃',gym:'🏋',rest:'😴',general:'📋'}[t]||'📋';}
function guessTitle(l){const t=l.toLowerCase();if(/swim/.test(t))return'🏊 Swim';if(/bike|zwift/.test(t))return'🚴 Bike';if(/run|jog/.test(t))return'🏃 Run';if(/gym|strength/.test(t))return'🏋 Gym';return'Session';}

// ══════ HELPERS ══════
function weekKeys(){return Object.keys(app.weeks).sort((a,b)=>parseInt(a.replace('week',''))-parseInt(b.replace('week','')));}
function weekLabel(k){return 'Week '+k.replace('week','');}
function dayLabel(d){return d.charAt(0)+d.slice(1).toLowerCase();}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pk(w,d,i){return w+'__'+d+'__'+i;}
function gk(w,d,i){return 'gym__'+w+'__'+d+'__'+i;}
function weekProg(wk){
  const wd=app.weeks[wk];if(!wd)return{done:0,total:0};
  let done=0,total=0;
  for(const d of Object.keys(wd.days||{}))for(const s of(wd.days[d].sessions||[])){if(s.type!=='rest'){total++;if(s.done)done++;}}
  return{done,total};
}
function toast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function destroyCharts(){Object.values(chartInst).forEach(c=>{try{c.destroy();}catch(e){}});chartInst={};}
function paceToSecs(s){if(!s)return 0;const p=String(s).split(':');if(p.length===2)return(parseInt(p[0])||0)*60+(parseInt(p[1])||0);return 0;}
function secsToPace(s){const m=Math.floor(s/60);const sc=Math.round(s%60);return m+':'+(sc<10?'0':'')+sc;}
function fixActiveDay(){
  if(app.activeWeek&&app.weeks[app.activeWeek]){
    const days=Object.keys(app.weeks[app.activeWeek].days||{});
    if(!app.activeDay||!app.weeks[app.activeWeek].days[app.activeDay])app.activeDay=days[0]||null;
  }
}

function renderWeek() {

    el.innerHTML=`<div class="empty"><div class="empty-icon">⚡</div><h3>No plan yet</h3><p>Generate your full 70.3 plan or paste a custom week.</p><div class="btn-row" style="justify-content:center"><button class="primary-btn" onclick="setView('generate')">⚡ Generate full plan</button><button class="ghost-btn" onclick="setView('add')">Paste a week</button></div></div>`;
    return;
  }
  const wd=app.weeks[app.activeWeek];
  const dayKeys=Object.keys(wd.days||{});
  const activeDay=(app.activeDay&&wd.days[app.activeDay])?app.activeDay:dayKeys[0];
  const{done,total}=weekProg(app.activeWeek);
  const pct=total>0?Math.round(done/total*100):0;
  const phase=wd.phase||'';const pk2=phaseKey(phase);const tw=weekKeys().length;
  tb.textContent=weekLabel(app.activeWeek);
  pill.style.display='';pill.textContent=`${done}/${total} · ${pct}%`;
  ta.innerHTML=phase?`<span class="wr-badge b-${pk2}" style="font-size:11px;padding:3px 10px">${phase}</span>`:'';

  const phW={base:Math.floor(tw*.35),build:Math.floor(tw*.3),peak:Math.floor(tw*.2),taper:Math.floor(tw*.1),race:1};
  let html=`<div class="phase-strip">`;
  [{n:'Base',k:'base'},{n:'Build',k:'build'},{n:'Peak',k:'peak'},{n:'Taper',k:'taper'},{n:'Race',k:'race'}].forEach(p=>{
    html+=`<div class="pblock pb-${p.k}"><div class="pbn">${p.n}</div><div class="pbw">${phW[p.k]||1}w</div></div>`;

  for(const d of dayKeys){
    const hd=(wd.days[d].sessions||[]).some(s=>s.done)?' has-done':'';const active=d===activeDay?' active':'';

  }
  html+=`</div>`;
  const dayData=wd.days[activeDay];
  if(dayData?.subtitle)html+=`<p style="font-size:11px;color:var(--text3);margin-bottom:1rem;font-style:italic">${esc(dayData.subtitle)}</p>`;
  const sessions=dayData?.sessions||[];
  if(!sessions.length&&!dayData?.info)html+=`<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">🛌 Rest day — recover well.</div>`;

  sessions.forEach((s,i)=>{
    const isDone=s.done;
    const opts=s.options||[];const actOpt=s.activeOption||0;const curOpt=opts[actOpt];
    const perfData=app.perf[pk(app.activeWeek,activeDay,i)]||{};
    const gymData=app.gymLogs[gk(app.activeWeek,activeDay,i)]||{exercises:[{name:'',sets:'',reps:'',weight:''}]};
    const pkKey=pk(app.activeWeek,activeDay,i);const gkKey=gk(app.activeWeek,activeDay,i);
    const feels=['😴','😐','🙂','💪','🔥'];const selFeel=perfData.feel||'';

    html+=`<div class="scard t-${s.type}${isDone?' done':''}">
      <div class="ctop">
        <button class="ccheck" onclick="toggleDone('${app.activeWeek}','${activeDay}',${i})">${isDone?'✓':''}</button>
        <div class="cmeta">
          <div class="crow">
            <span class="cicon">${typeIcon(s.type)}</span>
            <span class="ctitle">${esc(s.title)}</span>
            <span class="cbadge ${s.type}">${s.type}</span>
            ${phase?`<span class="ai-badge">AI</span>`:''}
            ${isDone?`<span class="done-tag">✓ Done</span>`:''}
          </div>
        </div>
        <div class="cactions">
          <button class="cbtn" onclick="openMove('${app.activeWeek}','${activeDay}',${i})">Move</button>
          <button class="cbtn" onclick="openEdit('${app.activeWeek}','${activeDay}',${i})">Edit</button>
          <button class="cbtn red" onclick="delSession('${app.activeWeek}','${activeDay}',${i})">Del</button>
        </div>
      </div>`;
    if(opts.length>1){
      html+=`<div class="opt-tabs">`;
      opts.forEach((o,oi)=>html+=`<button class="otab${oi===actOpt?' on '+s.type:''}" onclick="selectOpt('${app.activeWeek}','${activeDay}',${i},${oi})">${esc(o.name||'Option '+(oi+1))}</button>`);
      html+=`</div>`;
    }
    const displayLines=curOpt?.lines||s.lines||[];
    if(displayLines.length)html+=`<div class="cbody">${esc(displayLines.join('\n'))}</div>`;

    // Perf log
    html+=`<div class="perf-log">
      <div class="perf-head" onclick="togglePerf('pb-${app.activeWeek}-${activeDay}-${i}')">
        <span class="perf-head-label">📊 Log performance</span>
        <span style="font-size:10px;color:var(--text3)">${isDone?'✓ logged':'▼ expand'}</span>
      </div>
      <div id="pb-${app.activeWeek}-${activeDay}-${i}" style="display:${isDone?'block':'none'}">`;

    if(s.type==='swim'){
      html+=`<div class="pfields sw">
        <div class="pfield"><label>Distance (m)</label><input class="pinput" type="number" placeholder="1900" value="${esc(perfData.distance||'')}" onchange="savePerf('${pkKey}','distance',this.value)"></div>
        <div class="pfield"><label>Total time</label><input class="pinput" type="text" placeholder="38:20" value="${esc(perfData.time||'')}" onchange="savePerf('${pkKey}','time',this.value)"></div>
        <div class="pfield"><label>Pace /100m</label><input class="pinput" type="text" placeholder="2:01" value="${esc(perfData.pace||'')}" onchange="savePerf('${pkKey}','pace',this.value)"></div>
      </div>`;
    } else if(s.type==='bike'){
      html+=`<div class="pfields bk">
        <div class="pfield"><label>Distance (km)</label><input class="pinput" type="number" step="0.1" placeholder="90" value="${esc(perfData.distance||'')}" onchange="savePerf('${pkKey}','distance',this.value)"></div>
        <div class="pfield"><label>Time</label><input class="pinput" type="text" placeholder="2:45" value="${esc(perfData.time||'')}" onchange="savePerf('${pkKey}','time',this.value)"></div>
        <div class="pfield"><label>Avg speed (km/h)</label><input class="pinput" type="number" step="0.1" placeholder="32.5" value="${esc(perfData.speed||'')}" onchange="savePerf('${pkKey}','speed',this.value)"></div>
        <div class="pfield"><label>Avg power (W)</label><input class="pinput" type="number" placeholder="185" value="${esc(perfData.power||'')}" onchange="savePerf('${pkKey}','power',this.value)"></div>
      </div>`;
    } else if(s.type==='run'){
      html+=`<div class="pfields rn">
        <div class="pfield"><label>Distance (km)</label><input class="pinput" type="number" step="0.1" placeholder="10" value="${esc(perfData.distance||'')}" onchange="savePerf('${pkKey}','distance',this.value)"></div>
        <div class="pfield"><label>Time</label><input class="pinput" type="text" placeholder="52:30" value="${esc(perfData.time||'')}" onchange="savePerf('${pkKey}','time',this.value)"></div>
        <div class="pfield"><label>Avg pace /km</label><input class="pinput" type="text" placeholder="5:15" value="${esc(perfData.pace||'')}" onchange="savePerf('${pkKey}','pace',this.value)"></div>
      </div>`;
    } else if(s.type==='gym'){
      html+=`<table class="gym-table"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Weight kg</th><th></th></tr></thead><tbody>`;
      gymData.exercises.forEach((ex,ei)=>{
        html+=`<tr>
          <td><input class="gx-input" type="text" placeholder="Bench Press" value="${esc(ex.name||'')}" onchange="saveGym('${gkKey}',${ei},'name',this.value)"></td>
          <td><input class="gx-input" type="number" placeholder="3" style="width:50px" value="${esc(ex.sets||'')}" onchange="saveGym('${gkKey}',${ei},'sets',this.value)"></td>
          <td><input class="gx-input" type="number" placeholder="10" style="width:50px" value="${esc(ex.reps||'')}" onchange="saveGym('${gkKey}',${ei},'reps',this.value)"></td>
          <td><input class="gx-input" type="number" step="0.5" placeholder="60" style="width:65px" value="${esc(ex.weight||'')}" onchange="saveGym('${gkKey}',${ei},'weight',this.value)"></td>
          <td><button class="cbtn red" onclick="delGymEx('${gkKey}',${ei})">✕</button></td>
        </tr>`;
      });
      html+=`</tbody></table><button class="add-ex-btn" onclick="addGymEx('${gkKey}')">＋ Add exercise</button>`;
    }

    html+=`<div class="feel-row">
      <span class="flabel">How was it?</span>
      ${feels.map(f=>`<button class="fbtn${selFeel===f?' on':''}" onclick="savePerf('${pkKey}','feel','${selFeel===f?'':f}')">${f}</button>`).join('')}
      <input class="fnote" type="text" placeholder="Notes..." value="${esc(perfData.note||'')}" onchange="savePerf('${pkKey}','note',this.value)">
    </div>`;

    const photos=perfData.photos||[];
    html+=`<div class="photo-row">`;
    photos.forEach((ph,pi)=>html+=`<img class="pthumb" src="${ph.data}" onclick="openLightbox('${pkKey}',${pi})" title="${esc(ph.caption||'')}"> `);
    html+=`<button class="add-photo-btn" onclick="triggerSessionPhoto('${pkKey}')">📸 Add photo</button></div>`;
    html+=`</div></div></div>`;
  });

  if(dayData?.info?.trim())html+=`<div class="info-block"><div class="info-block-lbl">Coach Notes</div><div class="info-block-body">${esc(dayData.info.trim())}</div></div>`;
  el.innerHTML=html;
}

// ══════ CALENDAR VIEW ══════
function renderCalendar(){
  destroyCharts();
  const el=document.getElementById('main-content');
  document.getElementById('topbar-title').textContent='Calendar';
  document.getElementById('topbar-pill').style.display='none';
  document.getElementById('topbar-actions').innerHTML='';
  const wks=weekKeys();
  if(!wks.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🗓</div><h3>No plan yet</h3><p>Generate your plan first.</p><button class="primary-btn" onclick="setView('generate')">⚡ Generate plan</button></div>`;return;}

  // Build date map
  const today=new Date(); today.setHours(0,0,0,0);
  const startMon=new Date(today);
  const dow=startMon.getDay();startMon.setDate(startMon.getDate()-(dow===0?6:dow-1));
  const typeCol={swim:'var(--swim)',bike:'var(--bike)',run:'var(--run)',gym:'var(--gym)',rest:'#6b7280',general:'var(--text3)'};
  const dateMap={};
  const DN=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
  for(const wk of wks){
    const wn=parseInt(wk.replace('week',''))-1;
    const ws=new Date(startMon);ws.setDate(ws.getDate()+wn*7);
    const wd=app.weeks[wk];if(!wd)continue;
    DN.forEach((d,di)=>{
      const date=new Date(ws);date.setDate(date.getDate()+di);
      const dk=date.toDateString();
      dateMap[dk]={sessions:(wd.days[d]&&wd.days[d].sessions)||[],week:wk,day:d,date:new Date(date)};
    });
  }

  let html=`<div class="cal-legend">
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--swim)"></div>Swim</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--bike)"></div>Bike</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--run)"></div>Run</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--gym)"></div>Gym</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--accent)"></div>Race Day</div>
  </div><div class="cal-months">`;

  const raceStr=new Date(2026,9,18).toDateString();
  let cur=new Date(startMon.getFullYear(),startMon.getMonth(),1);
  const endDate=new Date(2026,10,1);
  while(cur<endDate){
    const yr=cur.getFullYear(),mo=cur.getMonth();
    const monthEnd=new Date(yr,mo+1,0);
    html+=`<div class="cal-month-title">${cur.toLocaleString('default',{month:'long',year:'numeric'})}</div>`;
    html+=`<div class="cal-grid-header">`;
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>html+=`<div class="cal-dname">${d}</div>`);
    html+=`</div><div class="cal-grid">`;
    const firstDow=new Date(yr,mo,1).getDay();const pad=firstDow===0?6:firstDow-1;
    for(let p=0;p<pad;p++)html+=`<div class="cal-cell empty"></div>`;
    for(let d=1;d<=monthEnd.getDate();d++){
      const date=new Date(yr,mo,d);const dk=date.toDateString();
      const entry=dateMap[dk];const isRace=dk===raceStr;const isToday=dk===today.toDateString();
      const isCurWeek=entry&&entry.week===app.activeWeek;
      html+=`<div class="cal-cell${isRace?' race':''}${isCurWeek?' cur-week':''}${isToday?' today':''}" onclick="${entry?`selectCalDay('${entry.week}','${entry.day}')`:''}" style="${!entry&&!isRace?'opacity:.4':''}">`;
      html+=`<div class="cal-dnum">${d}</div>`;
      if(isRace)html+=`<div class="cal-sess" style="background:rgba(232,255,71,.15);color:var(--accent)">🏆 RACE</div>`;
      else if(entry&&entry.sessions.length){
        entry.sessions.filter(s=>s.type!=='rest').slice(0,3).forEach(s=>{
          const col=typeCol[s.type]||'var(--text3)';
          html+=`<div class="cal-sess${s.done?' done':''}" style="background:${col}18;color:${col};border-left:2px solid ${col}">${typeIcon(s.type)} ${esc(s.title.replace(/[🏊🚴🏃🏋😴📋]/g,'').trim().split(' ').slice(0,2).join(' '))}</div>`;
        });
      }
      html+=`</div>`;
    }
    const lastDow=monthEnd.getDay();const endPad=lastDow===0?0:7-lastDow;
    for(let p=0;p<endPad;p++)html+=`<div class="cal-cell empty"></div>`;
    html+=`</div>`;
    cur.setMonth(cur.getMonth()+1);
  }
  html+=`</div>`;
  el.innerHTML=html;
}
function selectCalDay(week,day){app.activeWeek=week;app.activeDay=day;setView('week');}

function renderCharts(){

  const el=document.getElementById('main-content');
  document.getElementById('topbar-title').textContent='Performance';
  document.getElementById('topbar-pill').style.display='none';
  document.getElementById('topbar-actions').innerHTML='';
  const filter=app.chartFilter;
  el.innerHTML=`<div class="cfilter-row">
    ${['all','swim','bike','run','gym'].map(f=>`<button class="cftab${filter===f?' on':''}" onclick="setCF('${f}')">${{all:'All',swim:'🏊 Swim',bike:'🚴 Bike',run:'🏃 Run',gym:'🏋 Gym'}[f]}</button>`).join('')}
  </div>

  <div id="charts-area"></div>`;
  setTimeout(()=>buildCharts(filter),50);

function setCF(f){app.chartFilter=f;saveState();renderCharts();}

function buildCharts(filter){
  const mr=document.getElementById('metrics-row');const ca=document.getElementById('charts-area');if(!mr||!ca)return;
  const wks=weekKeys();
  const swimD=[],bikeD=[],runD=[],gymD=[];
  for(const wk of wks){
    const wd=app.weeks[wk];if(!wd)continue;
    const wn=parseInt(wk.replace('week',''));
    for(const d of Object.keys(wd.days||{})){
      (wd.days[d].sessions||[]).forEach((s,i)=>{
        if(!s.done)return;
        const p=app.perf[pk(wk,d,i)]||{};
        const entry={week:wn,wl:weekLabel(wk),...p};
        if((filter==='all'||filter==='swim')&&s.type==='swim')swimD.push(entry);
        if((filter==='all'||filter==='bike')&&s.type==='bike')bikeD.push(entry);
        if((filter==='all'||filter==='run')&&s.type==='run')runD.push(entry);
        if((filter==='all'||filter==='gym')&&s.type==='gym'){
          const g=app.gymLogs[gk(wk,d,i)]||{exercises:[]};
          gymD.push({...entry,exercises:g.exercises||[]});
        }
      });
    }
  }
  const td=swimD.length+bikeD.length+runD.length+gymD.length;
  const totalKm=[...swimD,...bikeD,...runD].filter(d=>d.distance).reduce((a,d)=>a+(s=>s==='swim'?parseFloat(d.distance)/1000:parseFloat(d.distance))(d.type||''),0);
  const runPaces=runD.filter(d=>d.pace).map(d=>paceToSecs(d.pace)).filter(v=>v>0);
  const bestRun=runPaces.length?Math.min(...runPaces):0;
  const swimPaces=swimD.filter(d=>d.pace).map(d=>paceToSecs(d.pace)).filter(v=>v>0);
  const bestSwim=swimPaces.length?Math.min(...swimPaces):0;
  mr.innerHTML=`
    <div class="mcard"><div class="mval" style="color:var(--accent)">${td}</div><div class="mlbl">Sessions logged</div></div>
    <div class="mcard"><div class="mval" style="color:var(--bike)">${([...swimD,...bikeD,...runD].filter(d=>d.distance).reduce((a,d)=>a+parseFloat(d.distance||0),0)/([filter==='swim'?1000:1][0]||1)).toFixed(0)}<span style="font-size:14px"> ${filter==='swim'?'m':'km'}</span></div><div class="mlbl">Total distance</div></div>
    <div class="mcard"><div class="mval" style="color:var(--run)">${bestRun?secsToPace(bestRun)+'<span style="font-size:11px">/km</span>':'—'}</div><div class="mlbl">Best run pace</div></div>
    <div class="mcard"><div class="mval" style="color:var(--swim)">${bestSwim?secsToPace(bestSwim)+'<span style="font-size:10px">/100m</span>':'—'}</div><div class="mlbl">Best swim pace</div></div>`;

  const showSwim=(filter==='all'||filter==='swim')&&swimD.length>0;
  const showBike=(filter==='all'||filter==='bike')&&bikeD.length>0;
  const showRun=(filter==='all'||filter==='run')&&runD.length>0;
  const showGym=(filter==='all'||filter==='gym')&&gymD.length>0;
  if(!showSwim&&!showBike&&!showRun&&!showGym){ca.innerHTML=`<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">No logged data yet.<br><small>Mark sessions done and fill in the log to see charts.</small></div>`;return;}

  let ch=`<div class="charts-grid">`;
  if(showRun){ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🏃 Run Pace</span><span class="chart-sub">min/km</span></div><div class="chart-wrap"><canvas id="c-rp"></canvas></div></div>`;
    ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🏃 Run Distance</span><span class="chart-sub">km per session</span></div><div class="chart-wrap"><canvas id="c-rd"></canvas></div></div>`;}
  if(showBike){ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🚴 Bike Speed</span><span class="chart-sub">avg km/h</span></div><div class="chart-wrap"><canvas id="c-bs"></canvas></div></div>`;
    ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🚴 Bike Distance</span><span class="chart-sub">km per session</span></div><div class="chart-wrap"><canvas id="c-bd"></canvas></div></div>`;}
  if(showSwim){ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🏊 Swim Pace</span><span class="chart-sub">min/100m</span></div><div class="chart-wrap"><canvas id="c-sp"></canvas></div></div>`;
    ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🏊 Swim Distance</span><span class="chart-sub">meters</span></div><div class="chart-wrap"><canvas id="c-sd"></canvas></div></div>`;}
  if(showBike&&bikeD.some(d=>d.power))ch+=`<div class="chart-card"><div class="chart-head"><span class="chart-title">🚴 Bike Power</span><span class="chart-sub">avg watts</span></div><div class="chart-wrap"><canvas id="c-bw"></canvas></div></div>`;
  ch+=`</div>`;
  if(showGym){
    const exNames=[...new Set(gymD.flatMap(d=>d.exercises.map(e=>e.name).filter(n=>n)))];
    if(exNames.length){
      ch+=`<div class="charts-grid"><div class="chart-card wide"><div class="chart-head"><span class="chart-title">🏋 Weight Progression</span><span class="chart-sub">kg per exercise</span></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.5rem" id="gym-ex-tabs">${exNames.map((n,i)=>`<button class="otab gym${i===0?' on':''}" onclick="switchGymChart('${esc(n)}')">${esc(n)}</button>`).join('')}</div>
      <div class="chart-wrap tall"><canvas id="c-gym"></canvas></div></div></div>`;
    }
  }
  const wksAll=weekKeys();
  if(wksAll.length>0){
    ch+=`<div class="charts-grid"><div class="chart-card wide"><div class="chart-head"><span class="chart-title">Weekly Completion</span><span class="chart-sub">% sessions done</span></div><div class="chart-wrap"><canvas id="c-comp"></canvas></div></div></div>`;
  }
  ca.innerHTML=ch;

  const def={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(20,20,20,.95)',titleColor:'#f0efe8',bodyColor:'#9a9890',borderColor:'#333',borderWidth:1,padding:9,cornerRadius:5}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#5a5856',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#5a5856',font:{size:10}}}}};
  function lc(id,labels,data,color,yRev,yFmt){
    const c=document.getElementById(id);if(!c)return;
    const o=JSON.parse(JSON.stringify(def));if(yRev)o.scales.y.reverse=true;if(yFmt)o.scales.y.ticks.callback=yFmt;
    chartInst[id]=new Chart(c.getContext('2d'),{type:'line',data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+'22',fill:true,tension:.3,pointBackgroundColor:color,pointRadius:4,pointHoverRadius:6,borderWidth:2}]},options:o});
  }
  function bc(id,labels,data,color){
    const c=document.getElementById(id);if(!c)return;
    const o=JSON.parse(JSON.stringify(def));
    chartInst[id]=new Chart(c.getContext('2d'),{type:'bar',data:{labels,datasets:[{data,backgroundColor:color+'88',borderColor:color,borderWidth:1,borderRadius:3}]},options:o});
  }
  const paceFmt=v=>{const m=Math.floor(v);const s=Math.round((v-m)*60);return m+':'+(s<10?'0':'')+s;};
  if(showRun){
    const rp=runD.filter(d=>d.pace);if(rp.length)lc('c-rp',rp.map(d=>d.wl),rp.map(d=>paceToSecs(d.pace)/60),'#fb923c',true,paceFmt);
    const rd=runD.filter(d=>d.distance);if(rd.length)bc('c-rd',rd.map(d=>d.wl),rd.map(d=>parseFloat(d.distance)),'#fb923c');
  }
  if(showBike){
    const bs=bikeD.filter(d=>d.speed);if(bs.length)lc('c-bs',bs.map(d=>d.wl),bs.map(d=>parseFloat(d.speed)),'#4ade80',false);
    const bd=bikeD.filter(d=>d.distance);if(bd.length)bc('c-bd',bd.map(d=>d.wl),bd.map(d=>parseFloat(d.distance)),'#4ade80');
    const bw=bikeD.filter(d=>d.power);if(bw.length)lc('c-bw',bw.map(d=>d.wl),bw.map(d=>parseFloat(d.power)),'#a78bfa',false);
  }
  if(showSwim){
    const sp=swimD.filter(d=>d.pace);if(sp.length)lc('c-sp',sp.map(d=>d.wl),sp.map(d=>paceToSecs(d.pace)/60),'#38bdf8',true,paceFmt);
    const sd=swimD.filter(d=>d.distance);if(sd.length)bc('c-sd',sd.map(d=>d.wl),sd.map(d=>parseFloat(d.distance)),'#38bdf8');
  }
  if(showGym){
    const exNames=[...new Set(gymD.flatMap(d=>d.exercises.map(e=>e.name).filter(n=>n)))];
    if(exNames.length)buildGymChart(exNames[0],gymD);
  }
  const cc=document.getElementById('c-comp');
  if(cc){
    const cl=wksAll.map(w=>weekLabel(w));const cv=wksAll.map(w=>{const{done,total}=weekProg(w);return total>0?Math.round(done/total*100):0;});
    const o=JSON.parse(JSON.stringify(def));o.scales.y.max=100;o.scales.y.ticks.callback=v=>v+'%';
    chartInst['c-comp']=new Chart(cc.getContext('2d'),{type:'bar',data:{labels:cl,datasets:[{data:cv,backgroundColor:cv.map(v=>v>=80?'#4ade8088':v>=50?'#fb923c88':'#f8717188'),borderColor:cv.map(v=>v>=80?'#4ade80':v>=50?'#fb923c':'#f87171'),borderWidth:1,borderRadius:3}]},options:o});
  }
}
function buildGymChart(name,gymData){
  const entries=gymData.map(d=>({wl:d.wl,ex:d.exercises.find(e=>e.name===name)})).filter(e=>e.ex&&e.ex.weight);
  const c=document.getElementById('c-gym');if(!c)return;
  if(chartInst['c-gym']){chartInst['c-gym'].destroy();}
  chartInst['c-gym']=new Chart(c.getContext('2d'),{type:'line',data:{labels:entries.map(e=>e.wl),datasets:[{data:entries.map(e=>parseFloat(e.ex.weight)),borderColor:'#a78bfa',backgroundColor:'#a78bfa22',fill:true,tension:.3,pointBackgroundColor:'#a78bfa',pointRadius:5,pointHoverRadius:7,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(20,20,20,.95)',titleColor:'#f0efe8',bodyColor:'#9a9890',borderColor:'#333',borderWidth:1,callbacks:{label:c=>c.parsed.y+' kg'}}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#5a5856',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#5a5856',font:{size:10},callback:v=>v+' kg'}}}}});
}
function switchGymChart(name){
  document.querySelectorAll('#gym-ex-tabs .otab').forEach(b=>b.classList.toggle('on',b.textContent===name));
  const wks=weekKeys();const gymD=[];
  for(const wk of wks)for(const d of Object.keys(app.weeks[wk]?.days||{}))(app.weeks[wk].days[d].sessions||[]).forEach((s,i)=>{if(s.type==='gym'&&s.done){const g=app.gymLogs[gk(wk,d,i)]||{exercises:[]};gymD.push({wl:weekLabel(wk),exercises:g.exercises||[]});}});
  buildGymChart(name,gymD);
}

    <div class="w-disc-row">
      <div class="w-disc"><div class="w-disc-icon">🏊</div><div class="w-disc-val" style="color:var(--swim)">${swimKm.toFixed(1)}</div><div class="w-disc-lbl">km swum</div></div>
      <div class="w-disc"><div class="w-disc-icon">🚴</div><div class="w-disc-val" style="color:var(--bike)">${bikeKm.toFixed(0)}</div><div class="w-disc-lbl">km biked</div></div>
      <div class="w-disc"><div class="w-disc-icon">🏃</div><div class="w-disc-val" style="color:var(--run)">${runKm.toFixed(1)}</div><div class="w-disc-lbl">km run</div></div>
      <div class="w-disc"><div class="w-disc-icon">🏋</div><div class="w-disc-val" style="color:var(--gym)">${gymD}</div><div class="w-disc-lbl">gym sessions</div></div>
    </div>
  </div>
  <hr class="w-divider">
  <div class="w-section">
    <div class="w-label">Personal bests logged</div>
    <div class="w-stat-grid">
      <div class="w-stat"><div class="w-stat-val" style="color:var(--run)">${bestRun?secsToPace(bestRun)+'/km':'—'}</div><div class="w-stat-lbl">Best run pace</div></div>

      <div class="w-stat"><div class="w-stat-val" style="color:var(--swim)">${bestSwim?secsToPace(bestSwim)+'/100m':'—'}</div><div class="w-stat-lbl">Best swim pace</div></div>
    </div>
  </div>
  <hr class="w-divider">

function setPF(f){app.photoFilter=f;saveState();renderPhotos();}
function handleGlobalPhoto(e){
  const files=e.target.files;if(!files||!files.length)return;
  let n=0;
  Array.from(files).forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{
      const wl=app.activeWeek?weekLabel(app.activeWeek):'General';
      app.photos.push({data:ev.target.result,caption:'',wl,date:new Date().toLocaleDateString(),id:Date.now()+Math.random()});
      n++;if(n===files.length){saveState();if(app.view==='photos')renderPhotos();toast(`✓ ${n} photo${n>1?'s':''} added`);}
    };
    r.readAsDataURL(file);
  });
  e.target.value='';
}
function triggerSessionPhoto(key){_sessionPhotoKey=key;document.getElementById('photo-session-file').click();}
function handleSessionPhoto(e){
  const file=e.target.files[0];if(!file||!_sessionPhotoKey)return;
  const key=_sessionPhotoKey;
  const r=new FileReader();
  r.onload=ev=>{
    if(!app.perf[key])app.perf[key]={};
    if(!app.perf[key].photos)app.perf[key].photos=[];
    app.perf[key].photos.push({data:ev.target.result,caption:'',date:new Date().toLocaleDateString()});
    const wl=app.activeWeek?weekLabel(app.activeWeek):'General';
    app.photos.push({data:ev.target.result,caption:'',wl,date:new Date().toLocaleDateString(),id:Date.now()});
    saveState();renderWeek();toast('✓ Photo attached');
  };
  r.readAsDataURL(file);
  e.target.value='';_sessionPhotoKey=null;
}
function openLightbox(key,pi){
  const ph=app.perf[key]?.photos?.[pi];if(!ph)return;
  showLightbox(ph,()=>{app.perf[key].photos.splice(pi,1);saveState();closeModal();renderWeek();});
}
function openGlobalLb(idx){
  const ph=app.photos[idx];if(!ph)return;
  showLightbox(ph,()=>{app.photos.splice(idx,1);saveState();closeModal();renderPhotos();},ph);
}
function showLightbox(ph,onDel,phRef){

    <img src="${ph.data}">

function getSupaClient(){
  const sc=app.syncConfig;
  if(!sc?.url||!sc?.key) return null;
  if(_supaClient) return _supaClient;
  // Use the Supabase JS SDK loaded from CDN
  if(typeof supabase === 'undefined') return null;
  _supaClient = supabase.createClient(sc.url, sc.key);
  return _supaClient;
}

function debouncedSync(){clearTimeout(_syncTimer2);_syncTimer2=setTimeout(()=>pushCloud(true),2500);}

function updateSyncBar(){
  const dot=document.getElementById('sdot');const lbl=document.getElementById('slabel');if(!dot||!lbl)return;
  const sc=app.syncConfig||{};
  if(!sc.url||!sc.key){dot.className='sdot off';lbl.textContent='Sync: tap to set up';return;}
  const cls={ok:'sdot ok',busy:'sdot busy',err:'sdot err',off:'sdot off'};
  const labels={ok:'Sync: up to date'+(sc.lastSync?' · '+sc.lastSync:''),busy:'Sync: saving...',err:'Sync: error — retry',off:'Sync: connecting...'};
  dot.className=cls[_syncState]||'sdot off';lbl.textContent=labels[_syncState]||'Sync';
}

function syncPayload(){const{photos,...rest}=app;return rest;}

async function pushCloud(silent){
  const client=getSupaClient();if(!client){if(!silent)toast('⚠ Sync not set up');return;}
  _syncState='busy';updateSyncBar();
  try{
    const{error}=await client.from('training_data').upsert({id:1,data:JSON.stringify(syncPayload()),updated_at:new Date().toISOString()});
    if(error)throw new Error(error.message);
    _syncState='ok';app.syncConfig.lastSync=new Date().toLocaleTimeString();
    try{localStorage.setItem(LS,JSON.stringify(app));}catch(e){}
    updateSyncBar();if(!silent)toast('☁ Synced to cloud');
  }catch(e){_syncState='err';updateSyncBar();if(!silent)toast('⚠ Sync failed: '+e.message,3500);}
}

async function pullCloud(silent){
  const client=getSupaClient();if(!client)return false;
  _syncState='busy';updateSyncBar();
  try{
    const{data,error}=await client.from('training_data').select('data').eq('id',1).single();
    if(error&&error.code==='PGRST116'){
      // No data yet — that's ok on first pull
      _syncState='ok';updateSyncBar();
      if(!silent)toast('No cloud data yet — push from your other device first');
      return false;
    }
    if(error)throw new Error(error.message);
    if(!data?.data)throw new Error('No data found');
    const parsed=JSON.parse(data.data);
    if(!parsed?.weeks)throw new Error('Invalid data');
    const localPhotos=app.photos||[];
    Object.assign(app,parsed);
    app.photos=localPhotos;
    app.syncConfig.url=app.syncConfig.url;
    app.syncConfig.key=app.syncConfig.key;
    app.syncConfig.lastSync=new Date().toLocaleTimeString();
    applyTheme(app.theme||'dark');
    try{localStorage.setItem(LS,JSON.stringify(app));}catch(e){}
    _syncState='ok';updateSyncBar();if(!silent)toast('☁ Data pulled from cloud');
    return true;
  }catch(e){_syncState='err';updateSyncBar();if(!silent)toast('⚠ Pull failed: '+e.message,3500);return false;}
}

async function testAndSaveSync(url,key){
  try{
    const client=supabase.createClient(url,key);
    const{error}=await client.from('training_data').select('id').limit(1);
    if(error&&error.code!=='PGRST116')throw new Error(error.message);
    return true;
  }catch(e){throw e;}
}

async function initSync(){
  const sc=app.syncConfig;
  if(sc?.url&&sc?.key){
    _syncState='busy';updateSyncBar();
    const ok=await pullCloud(true);
    if(ok){fixActiveDay();render();}
    else{_syncState='err';updateSyncBar();}
  }
}

async function doSetupSync(){
  const urlEl=document.getElementById('sync-url');const keyEl=document.getElementById('sync-key');const errEl=document.getElementById('sync-err');
  const url=(urlEl?.value.trim()||'').replace(/\/$/,'');
  const key=(keyEl?.value.trim())||'';
  if(!url||!key){if(errEl)errEl.textContent='⚠ Enter both the project URL and API key';return;}
  if(!url.startsWith('https://')){if(errEl)errEl.textContent='⚠ URL should start with https://';return;}
  if(errEl)errEl.textContent='Testing connection...';
  try{
    await testAndSaveSync(url,key);
    app.syncConfig={url,key,autoSync:true,lastSync:''};
    saveState();
    // Push current data up
    await pushCloud(true);
    _syncState='ok';
    toast('✓ Connected! Your data is syncing.',4000);
    render();
  }catch(e){
    if(errEl)errEl.textContent='⚠ '+e.message;
    _syncState='err';updateSyncBar();
  }
}
async function doPull(){const ok=await pullCloud(false);if(ok){fixActiveDay();render();}}
function toggleAutoSync(v){app.syncConfig.autoSync=v;saveState();renderSync();}
function disconnectSync(){
  if(!confirm('Disconnect sync? Your local data stays intact.'))return;
  app.syncConfig={url:'',key:'',autoSync:true,lastSync:''};_supaClient=null;
  _syncState='off';saveState();render();toast('Disconnected');
}

async function doGenerateFirst2(){
  const status=document.getElementById('gen-status-main');
  const level=document.getElementById('gen-level')?.value||'returning';
  const longRun=parseFloat(document.getElementById('gen-longrun')?.value||5);
  const pain=parseInt(document.getElementById('gen-pain')?.value||2);
  const weak=document.getElementById('gen-weak')?.value||'run';
  const daysToRace=Math.max(0,Math.ceil((RACE-new Date())/864e5));

  if(status)status.textContent='⚡ AI is building your first 2 weeks...';

  try{
    const prompt=`Generate the first 2 weeks of an IRONMAN 70.3 training plan for this athlete.

ATHLETE PROFILE:
- Race: October 18, 2026 (${daysToRace} days away, ~${Math.round(daysToRace/7)} weeks)
- Fitness level: ${level}
- Longest recent run: ${longRun} km
- Current injury pain: ${pain}/10 (calf issue)
- Main weakness: ${weak}
- Goal: complete IRONMAN 70.3 (1.9km swim, 90km bike, 21.1km run)

RULES:
- Week 1 should be conservative — athlete is ${pain>=5?'injured, very light running only':pain>=3?'recovering, cautious running':level==='returning'?'just returning to training':'building back up'}
- ${pain>=5?'NO running in week 1 — substitute with pool running or easy bike':'Run distances: week 1 = '+Math.max(5,longRun)+' km easy, week 2 = '+Math.min(8,longRun*1.1).toFixed(1)+' km'}
- MUST include exactly 1 long run per week on Sunday (even if short due to injury)
- Include swim, bike, run, gym each week
- Runs should NOT be 5km — minimum 6km, build properly
- Long bike on Saturday
- Monday = rest/recovery always
- Be specific with distances, paces, sets

Respond in JSON only. No markdown. No preamble. Exactly this structure:
{"week1":{"theme":"Week 1 theme","days":{"MONDAY":{"subtitle":"Rest","sessions":[],"info":"Rest day"},"TUESDAY":{"subtitle":"Bike + Gym","sessions":[{"title":"🚴 Bike","type":"bike","lines":["60 min Z2","10 min warm-up","40 min steady pace","10 min cool-down","Cadence 85-95 rpm"]},{"title":"🏋 Gym — Upper","type":"gym","lines":["3x10 Bench Press","3x10 Rows","3x12 Pull-ups","Core: 3x45s plank"]}]},"WEDNESDAY":{"subtitle":"Swim","sessions":[{"title":"🏊 Swim","type":"swim","lines":["2.0 km total","300 warm-up","4x200 moderate pace (30s rest)","4x50 fast","200 cool-down"]}]},"THURSDAY":{"subtitle":"Run + Gym","sessions":[{"title":"🏃 Run","type":"run","lines":["7 km easy","Z2 pace - conversational","HR below 145 bpm","Stop if calf pain increases"]},{"title":"🏋 Gym — Lower","type":"gym","lines":["3x12 Romanian Deadlift","3x15 Glute bridges","3x15 Calf raises (slow eccentric)","Core: 3x45s plank"]}]},"FRIDAY":{"subtitle":"Optional","sessions":[],"info":"Full rest or 30 min easy spin"},"SATURDAY":{"subtitle":"Long Ride","sessions":[{"title":"🚴 Long Bike","type":"bike","lines":["75 km","First 15 km easy","Main block Z2","Last 10 km easy","Gel every 35 min"]}]},"SUNDAY":{"subtitle":"Long Run","sessions":[{"title":"🏃 Long Run","type":"run","lines":["8 km easy","Aerobic pace throughout","Gel at 40 min if over 60 min"]}]}}},"week2":{"theme":"Week 2 theme","days":{...same structure...}}}`;

    const res=await fetch('https://round-glade-ca13.joao-carvalho-santos1811.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4000,
        system:'You are a professional triathlon coach. Return only valid JSON, no markdown, no explanation.',
        messages:[{role:'user',content:prompt}]
      })
    });

    const data=await res.json();
    let raw=data.content?.[0]?.text||'';
    raw=raw.split('\u0060\u0060\u0060json').join('').split('\u0060\u0060\u0060').join('').trim();

    let parsed;
    try{parsed=JSON.parse(raw);}
    catch(e){const m=raw.match(/\{[\s\S]*\}/);if(m)parsed=JSON.parse(m[0]);else throw new Error('Could not parse AI response');}

    // Clear existing and add 2 new weeks
    app.weeks={};app.perf={};app.gymLogs={};
    const addWeek=(weekData,weekNum)=>{
      const key='week'+weekNum;

      app.weeks[key]={days,phase:'Base',subtitle:`Week ${weekNum} — AI Generated (${weekData.theme||'Base'})`,weekNum,aiGenerated:true};

    addWeek(parsed.week1,1);
    addWeek(parsed.week2,2);

  }catch(e){
    if(status)status.textContent='⚠ Error: '+e.message;
    toast('⚠ Failed: '+e.message,4000);
  }
}

function buildTrainingContext() {
  const wks = weekKeys();
  const lastWk = wks.length > 0 ? wks[wks.length-1] : null;
  const {done,total} = lastWk ? weekProg(lastWk) : {done:0,total:0};
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  const daysToRace = Math.max(0, Math.ceil((RACE - new Date()) / 864e5));

  // Recent performance
  let recentPerf = '';
  if (lastWk) {
    const wd = app.weeks[lastWk];
    for (const d of Object.keys(wd.days||{})) {
      (wd.days[d].sessions||[]).forEach((s,i) => {
        if (!s.done) return;
        const p = app.perf[pk(lastWk,d,i)] || {};
        if (s.type==='run' && p.pace) recentPerf += `Run pace: ${p.pace}/km. `;
        if (s.type==='bike' && p.speed) recentPerf += `Bike speed: ${p.speed}km/h. `;
        if (s.type==='swim' && p.pace) recentPerf += `Swim pace: ${p.pace}/100m. `;
      });
    }
  }

  return `You are a professional triathlon coach specialising in IRONMAN 70.3 preparation. 
Athlete profile:
- Race: IRONMAN 70.3 on October 18, 2026 (${daysToRace} days away)
- Currently recovering from a calf injury — be cautious with run volume increases
- Building toward: 1.9km swim, 90km bike, 21.1km run
- Current plan: ${wks.length} weeks loaded, ${lastWk ? weekLabel(lastWk)+' completion: '+pct+'%' : 'no weeks yet'}
- Recent performance: ${recentPerf || 'no logged data yet'}
- Long run target: build from current fitness toward 18-21km over coming months
- Approach: 1 long run per week, progressive overload, injury-aware

Give practical, specific, concise advice. Use km not miles. Be direct — this athlete wants real coaching not generic tips.`;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input?.value.trim();
  if (!msg) return;
  input.value = '';

  if (!app.aiHistory) app.aiHistory = [];
  app.aiHistory.push({role:'user', content:msg});

  // Show user message immediately
  const cm = document.getElementById('chat-messages');
  if (cm) {
    cm.innerHTML += `<div class="chat-msg user">${esc(msg)}</div>`;
    cm.innerHTML += `<div class="chat-msg ai loading" id="typing-indicator">Coach is thinking<span class="ai-typing">...</span></div>`;
    cm.scrollTop = cm.scrollHeight;
  }

  try {
    const messages = [];
    // Add recent history (last 6 messages)
    const recent = app.aiHistory.slice(-7,-1);
    recent.forEach(m => messages.push({role: m.role === 'ai' ? 'assistant' : 'user', content: m.content}));
    messages.push({role:'user', content: msg});

    const res = await fetch('https://round-glade-ca13.joao-carvalho-santos1811.workers.dev', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildTrainingContext(),
        messages
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Sorry, I could not get a response. Try again.';

    app.aiHistory.push({role:'ai', content:reply});
    saveState();

    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
    if (cm) {
      cm.innerHTML += `<div class="chat-msg ai">${esc(reply)}</div>`;
      cm.scrollTop = cm.scrollHeight;
    }
  } catch(e) {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.textContent = '⚠ Could not reach AI. Check connection.';
  }
}

            done: false,
            activeOption: 0,
            options: [{name: 'AI Generated', lines: s.lines || []}]
          }))
        };
      }

      app.weeks[key] = {
        days: sessions_with_options,
        phase: ph,
        subtitle: `Week ${weekNum} — AI Generated (${weekData.theme || ph})`,
        weekNum,
        aiGenerated: true,
        generatedFrom: lastWk,
        feedback: fb
      };
    };

    addWeek(parsed.week1, nextWkNum);
    addWeek(parsed.week2, nextWkNum + 1);

    app.activeWeek = 'week' + nextWkNum;
    fixActiveDay();
    saveState();

    if (status) status.textContent = `✓ Weeks ${nextWkNum} and ${nextWkNum+1} added to your plan!`;
    toast(`✓ 2 new weeks generated by AI!`, 3000);

    setTimeout(() => setView('week'), 1500);

  } catch(e) {
    if (status) status.textContent = '⚠ Error: ' + e.message;
    toast('⚠ AI generation failed: ' + e.message, 4000);
  }
}

function askAIChat() {
  const notes = document.getElementById('fb-notes')?.value || '';
  const input = document.getElementById('chat-input');
  if (input && notes) {
    input.value = 'Based on this week: ' + notes;
  }
  document.getElementById('chat-input')?.focus();
}

// ══════ PASSWORD LOCK ══════
const PWD_HASH = '7a3f9b2e1c8d4f6a0b5e7c9d2f4a8b1e'; // LOCKIN04 obfuscated
function hashStr(s) {
  // Simple but effective obfuscation — not cryptographic but stops casual access
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h = ((h << 5) - h) + c;
    h |= 0;
  }
  return Math.abs(h).toString(16).padStart(8,'0');
}
const CORRECT_HASH = hashStr('LOCKIN04');
const SESSION_KEY = 'tri_unlocked_v1';

function checkPassword() {
  const inp = document.getElementById('lock-input');
  const val = inp.value.trim().toUpperCase();
  if (hashStr(val) === CORRECT_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'flex';
    loadState();
    render();
    initSync();
  } else {
    const err = document.getElementById('lock-error');
    err.textContent = 'Wrong password';
    inp.value = '';
    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 400);
  }
}

function initLock() {
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'flex';
    loadState();
    render();
    initSync();
  } else {
    // Show lock screen, focus input
    setTimeout(() => {
      const inp = document.getElementById('lock-input');
      if (inp) inp.focus();
    }, 100);
  }
}

initLock();
